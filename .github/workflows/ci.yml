name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend into backend/.venv (used by the Playwright global setup)
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python -m pip install --upgrade pip
          backend/.venv/Scripts/pip install -e "backend[dev]"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Fetch Electron binary
        working-directory: frontend
        run: node node_modules/electron/install.js
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test

  build:
    needs: [backend, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend (with freeze + service extras)
        run: python -m pip install --upgrade pip && pip install -e "backend[dev,build,win]"
      - name: Backend smoke (console scripts run + fresh DB builds)
        shell: bash
        run: |
          svr-migrate --db "$RUNNER_TEMP/build.sqlite" --seed-demo
          svr-backend --help
          svr-scheduler --help
      - name: Freeze backend (PyInstaller one-dir -> backend/packaging/dist/svr-backend)
        shell: pwsh
        run: ./backend/packaging/build-backend.ps1 -SkipInstall
      # Portable Tesseract (SDD ADR-6). Cached on the pinned version so the
      # UB Mannheim download is a rare cold path. -SkipHashCheck until the
      # SHA-256 is pinned in fetch-tesseract.ps1 (packaging session).
      - name: Cache staged Tesseract
        uses: actions/cache@v4
        with:
          path: installer/vendor/tesseract
          key: tesseract-5.3.3.20231005-w64
      - name: Stage Tesseract (SDD ADR-6)
        shell: pwsh
        run: ./installer/fetch-tesseract.ps1 -SkipHashCheck
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Fetch Electron binary
        working-directory: frontend
        run: node node_modules/electron/install.js
      - name: Package Electron app (frozen backend + Tesseract bundled as resources/)
        working-directory: frontend
        run: npm run dist
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: svr-iocl-station-installer
          path: installer/output/*.exe
          if-no-files-found: warn
      # Authenticode code-signing is not wired here (installer/README.md follow-on 1).
