<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVR IOCL Station</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div class="shell">
      <section id="login-view" class="login-view">
        <div class="brand-lockup">
          <img src="assets/iocl-logo.png" alt="SVR Indian Oil Service Station" class="brand-lockup-img" />
        </div>

        <div class="login-card">
          <form id="login-form">
            <label for="login-name">Login</label>
            <input id="login-name" name="login-name" autocomplete="username" required />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="submit">Sign in</button>
            <p id="login-error" class="error" role="alert"></p>
          </form>

          <form id="totp-form" hidden>
            <label for="totp-code">Authenticator code</label>
            <input id="totp-code" name="totp-code" inputmode="numeric" autocomplete="one-time-code"
                   pattern="[0-9 ]*" maxlength="9" placeholder="6-digit code" />
            <button type="submit">Verify</button>
            <button type="button" id="totp-cancel" class="link-btn">Back</button>
            <p id="totp-error" class="error" role="alert"></p>
          </form>

          <p style="margin-top: 10px">
            <a href="#" id="forgot-link" style="font-size: 12px; color: var(--io-blue)">Forgot password?</a>
          </p>
          <p id="forgot-status" class="error" role="status"></p>
        </div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
